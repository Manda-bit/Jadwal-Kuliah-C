<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Kelas C</title>
<style>
  :root{
    --paper:#f3f5f7;
    --sheet:#ffffff;
    --ink:#17222e;
    --ink-soft:#5c6b7a;
    --rule:#dde4ea;
    --rule-strong:#c3cdd6;
    --mark:#1f5f8b;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font:15px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;
    padding:28px 20px 80px;
  }
  .wrap{max-width:1040px;margin:0 auto}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0}
  .sub{color:var(--ink-soft);font-size:13px;margin-top:3px}
  .tools{display:flex;gap:8px}
  button{font:inherit;cursor:pointer;border-radius:5px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);padding:7px 13px}
  button:hover{border-color:#9aa8b4}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
  button.primary{background:var(--mark);border-color:var(--mark);color:#fff}
  button.danger{color:#a3242b;border-color:#e2c2c4}

  /* ---------- grid ---------- */
  .board{background:var(--sheet);border:1px solid var(--rule-strong);border-radius:6px;overflow:hidden}
  .days{display:grid;grid-template-columns:58px repeat(5,1fr);border-bottom:1px solid var(--rule-strong)}
  .days div{padding:9px 10px;font-size:12px;font-weight:600;color:var(--ink-soft);border-left:1px solid var(--rule)}
  .days div:first-child{border-left:0}
  .grid{display:grid;grid-template-columns:58px repeat(5,1fr);position:relative}
  .axis{position:relative;border-right:1px solid var(--rule)}
  .axis span{position:absolute;right:8px;transform:translateY(-50%);font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-soft)}
  .col{position:relative;border-left:1px solid var(--rule);cursor:crosshair}
  .col:first-of-type{border-left:0}
  .hline{position:absolute;left:0;right:0;height:1px;background:var(--rule);pointer-events:none}

  .ev{position:absolute;left:4px;right:4px;border-radius:4px;padding:6px 8px;overflow:hidden;
      cursor:pointer;border-left:3px solid var(--c);background:var(--bg);text-align:left;
      font:inherit;color:var(--ink);border-top:0;border-right:0;border-bottom:0}
  .ev:hover{filter:brightness(.97)}
  .ev b{display:block;font-weight:600;font-size:12.5px;line-height:1.25}
  .ev small{display:block;color:var(--ink-soft);font-size:11px;margin-top:3px}
  .ev .t{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--c);margin-bottom:4px;display:block}

  /* ---------- dialog ---------- */
  dialog{border:1px solid var(--rule-strong);border-radius:8px;padding:0;width:min(420px,92vw);color:var(--ink)}
  dialog::backdrop{background:rgba(23,34,46,.35)}
  .dlg{padding:20px}
  .dlg h2{margin:0 0 16px;font-size:17px;font-weight:600}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
  input,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--rule-strong);border-radius:5px;background:#fff;color:var(--ink)}
  .row{display:flex;gap:10px;margin-bottom:12px}
  .row>*{flex:1;min-width:0}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .actions .danger{margin-right:auto}

  .empty{padding:40px 16px;text-align:center;color:var(--ink-soft);font-size:14px}
  footer{margin-top:14px;color:var(--ink-soft);font-size:12px}

  @media (max-width:720px){
    body{padding:20px 14px 60px}
    .days,.grid{grid-template-columns:44px repeat(5,1fr)}
    .days div{padding:8px 5px;font-size:11px}
    .ev b{font-size:11px}
    .ev small,.ev .t{display:none}
  }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Jadwal Kelas C</h1>
      <div class="sub">Semester 1 &nbsp;— &nbsp;klik blok untuk mengubah, klik kolom kosong untuk menambah</div>
    </div>
    <div class="tools">
      <button id="add">Tambah kelas</button>
      <button id="reset">Kembalikan jadwal awal</button>
    </div>
  </header>

  <div class="board">
    <div class="days" id="days"></div>
    <div class="grid" id="grid"></div>
  </div>

  <footer id="status">Tersimpan otomatis di peramban ini.</footer>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlg" id="form">
    <h2 id="dlgTitle">Ubah kelas</h2>
    <div class="row"><div>
      <label for="f-nama">Mata kuliah</label>
      <input id="f-nama" required placeholder="Dasar Rangkaian Listrik">
    </div></div>
    <div class="row">
      <div><label for="f-kode">Kode</label><input id="f-kode" placeholder="MK122"></div>
      <div><label for="f-hari">Hari</label>
        <select id="f-hari">
          <option value="0">Senin</option><option value="1">Selasa</option>
          <option value="2">Rabu</option><option value="3">Kamis</option>
          <option value="4">Jumat</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label for="f-mulai">Mulai</label><input id="f-mulai" type="time" required></div>
      <div><label for="f-selesai">Selesai</label><input id="f-selesai" type="time" required></div>
    </div>
    <div class="row">
      <div><label for="f-dosen">Dosen</label><input id="f-dosen" placeholder="AJ"></div>
      <div><label for="f-ruang">Ruang</label><input id="f-ruang" placeholder="401"></div>
    </div>
    <div class="actions">
      <button type="button" class="danger" id="hapus">Hapus</button>
      <button type="button" id="batal">Batal</button>
      <button type="submit" class="primary">Simpan</button>
    </div>
  </form>
</dialog>

<script>
const HARI = ["Senin","Tuesday","Rabu","Kamis","Jumat"];
HARI[1] = "Selasa";
const KEY = "jadwal-kelas-c";
const START = 7*60+30, END = 17*60+30, PX = 1.15;   // skala menit → piksel

const AWAL = [
  {kode:"MK122", nama:"Dasar Rangkaian Listrik",   dosen:"AJ", ruang:"401",     hari:0, mulai:"07:50", selesai:"12:00"},
  {kode:"MK125", nama:"Kesehatan dan Keselamatan Kerja", dosen:"NA", ruang:"TR3.7", hari:0, mulai:"14:10", selesai:"17:00"},
  {kode:"MK121", nama:"Aljabar Geometri",          dosen:"BS", ruang:"402",     hari:1, mulai:"07:50", selesai:"10:20"},
  {kode:"MK124", nama:"Fisika",                    dosen:"WR", ruang:"RTF61",   hari:1, mulai:"12:50", selesai:"17:00"},
  {kode:"MK126", nama:"Dasar Teknik Mekanik",      dosen:"DN", ruang:"102",     hari:2, mulai:"12:50", selesai:"17:00"},
  {kode:"PK1MK", nama:"Pendidikan Agama",          dosen:"FF/RU/LA", ruang:"Online", hari:3, mulai:"07:50", selesai:"09:30"},
  {kode:"MK123", nama:"Dasar Pemrograman",         dosen:"BS", ruang:"Online",  hari:3, mulai:"10:20", selesai:"12:00"},
  {kode:"MK120", nama:"Proyek Pengenalan Mekatronika", dosen:"WR", ruang:"401", hari:3, mulai:"14:10", selesai:"17:00"},
  {kode:"MK123", nama:"Dasar Pemrograman",         dosen:"BS", ruang:"104",     hari:4, mulai:"14:10", selesai:"17:00"},
];

const WARNA = ["#1f5f8b","#8a5a2b","#3f6f4a","#6b4a86","#a04452","#2f6f6f","#7a6a1f"];
const kunci = {};
function warna(item){
  const k = (item.kode || item.nama || "").trim().toLowerCase();
  if(!(k in kunci)) kunci[k] = WARNA[Object.keys(kunci).length % WARNA.length];
  return kunci[k];
}
const mnt = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const jam = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");

let data = AWAL.map(x => ({...x}));
let indeksAktif = null;

async function muat(){
  try{
    const r = await window.storage.get(KEY);
    if(r && r.value) data = JSON.parse(r.value);
  }catch(e){ /* belum ada data tersimpan */ }
  gambar();
}
async function simpan(){
  gambar();
  try{ await window.storage.set(KEY, JSON.stringify(data)); }
  catch(e){ status.textContent = "Perubahan tampil di layar, tapi gagal disimpan permanen."; }
}

const grid = document.getElementById("grid");
const days = document.getElementById("days");
const status = document.getElementById("status");

function gambar(){
  const tinggi = (END-START)*PX;
  days.innerHTML = "<div></div>" + HARI.map(h=>`<div>${h}</div>`).join("");

  let axis = "";
  for(let m = Math.ceil(START/60)*60; m <= END; m += 60)
    axis += `<span style="top:${(m-START)*PX}px">${jam(m)}</span>`;
  let html = `<div class="axis" style="height:${tinggi}px">${axis}</div>`;

  for(let d=0; d<5; d++){
    let lines = "";
    for(let m = Math.ceil(START/60)*60; m <= END; m += 60)
      lines += `<div class="hline" style="top:${(m-START)*PX}px"></div>`;
    let ev = "";
    data.forEach((it,i)=>{
      if(it.hari != d) return;
      const a = mnt(it.mulai), b = mnt(it.selesai);
      const c = warna(it);
      ev += `<button class="ev" data-i="${i}" style="--c:${c};--bg:${c}14;top:${(a-START)*PX}px;height:${Math.max((b-a)*PX-3,26)}px">
        <span class="t">${it.mulai}–${it.selesai}</span>
        <b>${esc(it.nama)}</b>
        <small>${[it.dosen,it.ruang].filter(Boolean).map(esc).join(" · ")}</small>
      </button>`;
    });
    html += `<div class="col" data-d="${d}" style="height:${tinggi}px">${lines}${ev}</div>`;
  }
  grid.innerHTML = html;
}
const esc = s => String(s??"").replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

/* ---------- interaksi ---------- */
grid.addEventListener("click", e=>{
  const ev = e.target.closest(".ev");
  if(ev){ buka(Number(ev.dataset.i)); return; }
  const col = e.target.closest(".col");
  if(!col) return;
  const y = e.clientY - col.getBoundingClientRect().top;
  let m = START + Math.round(y/PX/30)*30;                 // bulatkan ke 30 menit
  m = Math.min(Math.max(m, START), END-60);
  buka(null, {hari:Number(col.dataset.d), mulai:jam(m), selesai:jam(m+90)});
});

const dlg = document.getElementById("dlg");
const F = id => document.getElementById("f-"+id);

function buka(i, awal){
  indeksAktif = i;
  const it = i===null ? {nama:"",kode:"",dosen:"",ruang:"",...awal} : data[i];
  document.getElementById("dlgTitle").textContent = i===null ? "Tambah kelas" : "Ubah kelas";
  document.getElementById("hapus").style.display = i===null ? "none" : "";
  F("nama").value = it.nama; F("kode").value = it.kode || "";
  F("hari").value = it.hari; F("mulai").value = it.mulai; F("selesai").value = it.selesai;
  F("dosen").value = it.dosen || ""; F("ruang").value = it.ruang || "";
  dlg.showModal();
  F("nama").focus();
}

document.getElementById("form").addEventListener("submit", ()=>{
  const it = {
    nama:F("nama").value.trim(), kode:F("kode").value.trim(),
    dosen:F("dosen").value.trim(), ruang:F("ruang").value.trim(),
    hari:Number(F("hari").value), mulai:F("mulai").value, selesai:F("selesai").value
  };
  if(mnt(it.selesai) <= mnt(it.mulai)) it.selesai = jam(mnt(it.mulai)+60);
  if(indeksAktif===null) data.push(it); else data[indeksAktif] = it;
  simpan();
});
document.getElementById("batal").onclick = ()=> dlg.close();
document.getElementById("hapus").onclick = ()=>{
  data.splice(indeksAktif,1); dlg.close(); simpan();
};
document.getElementById("add").onclick = ()=> buka(null,{hari:0,mulai:"07:50",selesai:"09:30"});
document.getElementById("reset").onclick = ()=>{
  if(confirm("Kembalikan ke jadwal asli dari kampus? Semua perubahanmu hilang.")){
    data = AWAL.map(x=>({...x})); simpan();
  }
};

muat();
</script>
